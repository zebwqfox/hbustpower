org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Cloud config (update check, notice board, feature switches). Both values are public and ship in the APK.
# cloudConfigUrl    the static JSON on the filed domain
# cloudDownloadHosts  comma-separated hosts allowed to serve the APK; anything else is dropped
# Leave cloudConfigUrl empty and the feature is compiled out: no network calls, no UI.
cloudConfigUrl=https://hbustelec.imfurry.com/app/config.json
cloudDownloadHosts=cdn-imfurry.imfurry.com
# telemetryUrl  where the app posts its anonymous version/device report. Empty = the feature is compiled out
# and the settings switch never appears. Reporting is off until the user turns it on either way.
telemetryUrl=https://hbustelec.imfurry.com/api/v1/report
